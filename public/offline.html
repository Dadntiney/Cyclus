<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Je bent offline · GoFiev</title>
<meta name="theme-color" content="#f6f1ee">
<style>
  :root { --bg: #f6f1ee; --card: #fffdfc; --ink: #2e2529; --soft: #6e6166; --line: #e7ddd9; --sage: #3e5c55; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1719; --card: #262023; --ink: #f3ecea; --soft: #b3a6aa; --line: #3a3135; --sage: #3e5c55; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 1.5rem; padding: 32px 24px; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 16px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 1.6rem; margin: 20px 0 8px; }
  p { color: var(--soft); line-height: 1.55; margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--sage); border: 0; border-radius: 999px; padding: 12px 24px; min-height: 44px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Je bent even offline</h1>
  <p>GoFiev heeft internet nodig om je gegevens te laden. Zodra je weer verbinding hebt, kun je verder waar je was.</p>
  <button type="button" onclick="location.reload()">Opnieuw proberen</button>
</main>
<script>window.addEventListener("online", function () { location.reload() })</script>
</body>
</html>
